name: Загрузка регионов РФ

on:
  workflow_dispatch:  # Ручной запуск из интерфейса GitHub

jobs:
  load-regions:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: 🐍 Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv

      - name: 🔍 Диагностика CSV
        run: |
          echo "=== Заголовок ==="
          head -1 data/ru_regions.csv
          echo ""
          echo "=== Первая строка данных (первые 500 символов) ==="
          sed -n '2p' data/ru_regions.csv | cut -c1-500
          echo ""
          echo "=== Количество полей в первой строке ==="
          sed -n '2p' data/ru_regions.csv | tr ';' '\n' | wc -l
          echo ""
          echo "=== Последнее поле (первые 200 символов) ==="
          sed -n '2p' data/ru_regions.csv | rev | cut -d';' -f1 | rev | cut -c1-200
      
      - name: 🗺️ Загрузка регионов
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/load_regions.py
